name: Ocean Express CI

# LƯU Ý: `push` lên `main` đã được BỎ khỏi trigger ở đây.
# Deploy workflow (.github/workflows/deploy.yml) tự chạy job `test` riêng rồi
# mới deploy, nên nếu để `main` ở đây thì mỗi lần push sẽ chạy test 2 lần trùng
# lặp, tốn phút build. PR nhắm vào `main` thì vẫn được test đầy đủ.
on:
  push:
    branches: [ "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop", "release/*" ]

jobs:
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.4'
        cache-dependency-path: api/go.sum

    - name: Download dependencies
      run: go mod download

    - name: Vet
      run: go vet ./...

    - name: Run Unit Tests
      run: go test -v ./...

    - name: Build
      run: go build -v ./...

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: admin/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build Project
      run: npm run build
