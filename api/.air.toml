# Cấu hình Air — hot reload cho Go dev. Sửa file .go là tự build lại (~1s) và
# khởi động lại server, không cần build tay / rebuild Docker.
# Chạy: air  (trong thư mục api/)
root = "."
tmp_dir = "tmp"

[build]
  # Entry point của app.
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  bin = "./tmp/server.exe"
  # Không cần set env: main.go đã default DB_HOST=localhost, REDIS_HOST=localhost
  # (DB/Redis chạy trong Docker, expose cổng 5432/6379 ra máy). JWT_SECRET để trống
  # chỉ in cảnh báo, không lỗi — chấp nhận được cho dev. Muốn set thì export ở
  # terminal trước khi chạy `air` (vd: $env:JWT_SECRET="dev" trong PowerShell).
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  # Chỉ build lại khi .go đổi; bỏ qua file test để đỡ ồn.
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
